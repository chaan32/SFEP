services:
  postgres:
    image: postgres:16-alpine
    container_name: sfep-postgres
    environment:
      POSTGRES_DB: sfep
      POSTGRES_USER: sfep
      POSTGRES_PASSWORD: sfep
      TZ: Asia/Seoul
    ports:
      - "55432:5432"
    volumes:
      - sfep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfep -d sfep"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sfep-redis
    ports:
      - "6379:6379"
    volumes:
      - sfep-redis-data:/data
    command: redis-server --appendonly yes

  kafka:
    image: apache/kafka:3.7.2
    container_name: sfep-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - sfep-kafka-data:/var/lib/kafka/data

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sfep-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sfep-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: sfep-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - sfep-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  sfep-postgres-data:
  sfep-redis-data:
  sfep-kafka-data:
  sfep-prometheus-data:
  sfep-grafana-data:
