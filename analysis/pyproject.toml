[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sfep-equipment-quality"
version = "1.1.0"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.0",
  "jsonschema==4.24.0",
]

[project.scripts]
sfep-equipment-quality = "equipment_quality.cli:main"

[tool.setuptools]
packages = ["equipment_quality"]
include-package-data = false

[tool.setuptools.package-data]
equipment_quality = ["contracts/v1/*.schema.json", "contracts/v2/*.schema.json", "sfep_producer_provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "real_data: requires SFEP_STEEL_DATA_DIR and validates the approved local snapshot",
]
